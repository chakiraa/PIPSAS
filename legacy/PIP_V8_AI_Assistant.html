<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIP — Procurement Intelligence Platform</title>

  <!-- Fonts: Plus Jakarta Sans (display) + Inter (body) + JetBrains Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
    /* ── Global Reset & Font Assignment ── */
    *, *::before, *::after {
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
    }
    code, .mono, .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }

    /* ════════════════════════════════════════════
       DESIGN TOKENS — PIP DARK NAVY (v8)
    ════════════════════════════════════════════ */
    :root {
      /* ── Dark (default) — deep navy matching design ── */
      --bg:            #090d18;
      --bg2:           #0c1120;
      --card:          #111827;
      --card2:         #192236;
      --border:        rgba(255,255,255,0.07);
      --border2:       rgba(255,255,255,0.13);
      --text:          #eef2ff;
      --text2:         #8892b0;
      --muted:         #4a5578;
      --th-bg:         #0c1120;
      --row-alt:       rgba(255,255,255,0.018);
      --row-hover:     rgba(79,110,247,0.07);
      /* Sidebar */
      --sidebar-bg:    #06080f;
      /* Topbar */
      --hdr-bg:        rgba(9,13,24,0.95);
      --hdr-border:    rgba(255,255,255,0.07);
      --hdr-text:      #f0f4ff;
      --hdr-sub:       #4a5578;
      --hdr-icon-bg:   rgba(255,255,255,0.06);
      --hdr-icon-clr:  #8892b0;
      /* Brand — blue/indigo primary */
      --blue:          #4f6ef7;
      --blue-dim:      rgba(79,110,247,0.14);
      --blue-bright:   #7289ff;
      --amber:         #f59e0b;
      --amber-dim:     rgba(245,158,11,0.12);
      --green:         #10b981;
      --green-dim:     rgba(16,185,129,0.14);
      --red:           #ef4444;
      --orange:        #f97316;
      --purple:        #8b5cf6;
      --cyan:          #06b6d4;
      --teal:          #14b8a6;
      --scroll-track:  #090d18;
      --scroll-thumb:  rgba(255,255,255,0.08);
      /* Spacing tokens */
      --content-px:    40px;
      --content-py:    32px;
      --card-p:        20px 24px;
      --cell-px:       18px;
      --cell-py:       12px;
      /* Radius scale — softer, friendlier geometry */
      --r-sm:  10px;
      --r-md:  14px;
      --r-lg:  20px;
      --r-xl:  26px;
      --r-pill: 999px;
      /* Signature gradient — reused on the AI assistant + header accent */
      --grad-signature: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 50%, #06b6d4 100%);
      --shadow-card: 0 4px 20px rgba(0,0,0,0.28), 0 1px 4px rgba(0,0,0,0.18);
      --shadow-pop:  0 24px 56px rgba(0,0,0,0.5), 0 4px 14px rgba(0,0,0,0.3);
    }
    [data-theme="light"] {
      --bg:            #f4f6fc;
      --bg2:           #eaeef9;
      --card:          #ffffff;
      --card2:         #f6f8fd;
      --border:        rgba(20,30,70,0.08);
      --border2:       rgba(20,30,70,0.14);
      --text:          #11162a;
      --text2:         #495a82;
      --muted:         #7886ab;
      --th-bg:         #f6f8fd;
      --row-alt:       rgba(20,30,70,0.012);
      --row-hover:     rgba(79,110,247,0.05);
      --sidebar-bg:    #ffffff;
      --hdr-bg:        rgba(255,255,255,0.92);
      --hdr-border:    rgba(20,30,70,0.07);
      --hdr-text:      #11162a;
      --hdr-sub:       #7886ab;
      --hdr-icon-bg:   rgba(79,110,247,0.07);
      --hdr-icon-clr:  #4f6ef7;
      --scroll-track:  #f4f6fc;
      --scroll-thumb:  rgba(20,30,70,0.12);
      --shadow-card: 0 2px 10px rgba(31,41,90,0.06), 0 1px 2px rgba(31,41,90,0.04);
      --shadow-pop:  0 24px 56px rgba(31,41,90,0.18), 0 4px 14px rgba(31,41,90,0.08);
    }

    /* ── Base ── */
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); transition: background 0.3s ease, color 0.3s ease; }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border2); }

    /* ── Cards & Surfaces ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 1px 4px rgba(0,0,0,0.2);
    }
    .card2 { background: var(--card2); border: 1px solid var(--border); }
    .glass {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.07);
    }
    [data-theme="light"] .glass {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,0.05);
    }

    /* ── Tables ── */
    .th-cell {
      background: var(--th-bg);
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px 22px;
    }
    .row-alt:nth-child(even) { background: var(--row-alt); }
    .row-alt td {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s ease;
      padding: 14px 22px;
    }
    .row-alt:hover td { background: var(--row-hover) !important; }
    .tbl-wrap { overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 400px); }

    /* ── Forms ── */
    input, textarea, select {
      background: var(--card);
      color: var(--text);
      border-color: var(--border);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.65; }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--blue) !important;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.16);
    }

    /* ── Tabs ── */
    .tab-active {
      color: var(--text);
      font-weight: 600;
      position: relative;
    }
    .tab-active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 8px; right: 8px;
      height: 2px;
      background: var(--blue);
      border-radius: 2px 2px 0 0;
    }
    .tab-inactive {
      border-bottom: 2px solid transparent;
      color: var(--muted);
      transition: color 0.18s ease;
    }
    .tab-inactive:hover { color: var(--text2); }

    /* ── Filter Buttons ── */
    .filter-btn-active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
      font-weight: 600;
      box-shadow: 0 0 14px rgba(79,110,247,0.35);
    }
    .filter-btn {
      background: var(--card);
      color: var(--text2);
      border-color: var(--border);
      transition: all 0.18s ease;
    }
    .filter-btn:hover { border-color: var(--blue); color: var(--text); background: rgba(79,110,247,0.06); }

    /* ── Upload Zone ── */
    .upload-zone {
      border: 2px dashed var(--border2);
      background: var(--card);
      transition: all 0.25s ease;
      border-radius: var(--r-lg);
    }
    .upload-zone:hover {
      border-color: var(--blue);
      background: rgba(79,110,247,0.04);
    }
    .upload-zone.drag-over {
      border-color: var(--blue);
      background: rgba(79,110,247,0.09);
      transform: scale(1.005);
      box-shadow: 0 0 30px rgba(79,110,247,0.18);
    }

    /* ── Stat Cards ── */
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: var(--shadow-card);
    }
    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--border2);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    [data-theme="light"] .stat-card { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    [data-theme="light"] .stat-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1); }

    /* ── KPI Icon ── */
    .kpi-icon {
      width: 40px; height: 40px;
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ── Comment Cell ── */
    .pencil-btn { opacity: 0; transition: opacity 0.18s ease; transform: scale(0.9); }
    .comment-wrap:hover .pencil-btn { opacity: 1; color: var(--blue); transform: scale(1); }

    /* ── Reset Button ── */
    .reset-btn {
      border-color: rgba(244,63,94,0.22);
      color: rgba(244,63,94,0.65);
      transition: all 0.18s ease;
      background: transparent;
    }
    .reset-btn:hover { border-color: var(--red); color: var(--red); background: rgba(244,63,94,0.08); }

    /* ── Global Search ── */
    .global-search {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      transition: all 0.2s ease;
    }
    .global-search::placeholder { color: rgba(255,255,255,0.35); }
    .global-search:focus {
      background: rgba(255,255,255,0.09);
      border-color: rgba(99,102,241,0.55);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    [data-theme="light"] .global-search { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.1); color: #0d1424; }
    [data-theme="light"] .global-search::placeholder { color: rgba(0,0,0,0.35); }
    [data-theme="light"] .global-search:focus {
      background: rgba(0,0,0,0.055);
      border-color: rgba(99,102,241,0.45);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .global-result {
      background: var(--card);
      border: 1px solid var(--border2);
      box-shadow: 0 24px 48px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.3);
    }
    .global-result-item { transition: background 0.12s ease; }
    .global-result-item:hover { background: var(--card2); }

    /* ── Contact Inputs ── */
    .contact-input {
      background: transparent !important;
      border: none !important;
      border-bottom: 1px solid var(--border) !important;
      border-radius: 0 !important;
      padding: 4px 0 !important;
      color: var(--text) !important;
      width: 100%;
      font-size: 13px;
    }
    .contact-input:focus { outline: none; border-bottom-color: var(--blue) !important; box-shadow: none !important; }

    /* ── Header — glassmorphism with gradient accent ── */
    .header-stripe {
      background: var(--hdr-bg);
      border-bottom: 1px solid var(--hdr-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background 0.3s ease, border-color 0.3s ease;
      position: relative;
    }
    .header-stripe::before {
      content: '';
      display: block;
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #4f6ef7 0%, #7c3aed 35%, #06b6d4 65%, #10b981 100%);
    }

    /* ── Logo glow ── */
    .logo-glow {
      background: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #06b6d4 100%) !important;
      box-shadow: 0 0 18px rgba(79,110,247,0.45), 0 0 36px rgba(79,110,247,0.12);
    }

    /* ── Animated tab badge ── */
    .tab-badge { transition: background 0.2s, color 0.2s; }

    /* ── Row accent lines ── */
    .row-red   { border-left: 3px solid var(--red);   }
    .row-amber { border-left: 3px solid var(--amber); }
    .row-blue  { border-left: 3px solid var(--blue);  }
    .row-green { border-left: 3px solid var(--green); }

    /* ── Chart.js canvas wrapper ── */
    .chart-wrapper { position: relative; }
    .chart-wrapper canvas { display: block; }

    /* ── Section heading ── */
    .section-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Pulse dot ── */
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(16,185,129,0.45); }
      50% { opacity: 0.8; transform: scale(1.25); box-shadow: 0 0 0 5px rgba(16,185,129,0); }
    }
    .pulse-dot { animation: pulse-dot 2.4s cubic-bezier(0.4,0,0.6,1) infinite; }

    /* ── Fade-in ── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fadeIn 0.36s cubic-bezier(0.2,0.8,0.2,1) forwards; }

    /* ── iOS-style toggle ── */
    .ios-toggle { position: relative; display: inline-flex; align-items: center; cursor: pointer; flex-shrink: 0; }
    .ios-toggle input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
    .ios-track {
      width: 36px; height: 22px; border-radius: 11px;
      background: var(--border2); transition: background 0.3s ease;
      position: relative; flex-shrink: 0;
    }
    .ios-toggle input:checked ~ .ios-track { background: var(--green); }
    .ios-thumb {
      position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
    }
    .ios-toggle input:checked ~ .ios-track .ios-thumb { transform: translateX(14px); }

    /* ── Row selection & solved state ── */
    .row-selected td {
      background: rgba(79,110,247,0.13) !important;
      font-weight: 600 !important;
    }
    .row-selected td:first-child {
      border-left: 3px solid var(--blue) !important;
    }
    .row-solved { opacity: 0.38; }
    .row-solved td.solvable-cell { text-decoration: line-through; text-decoration-color: var(--muted); }
    .td-check { width: 44px !important; padding-left: 18px !important; padding-right: 6px !important; }
    .td-toggle { width: 62px !important; padding-left: 18px !important; padding-right: 6px !important; }
    input.cb-row { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; accent-color: var(--blue); }

    /* ── Inline email panel slide-in ── */
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    .email-panel-enter { animation: slideDown 0.3s cubic-bezier(0.2,0.8,0.2,1) forwards; }

    /* ── Upload icon spin ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }

    /* ── Tab bar card (grouped) ── */
    .tab-active::after {
      /* Override: no bottom underline inside card — use background instead */
      height: 0;
    }
    .tab-active {
      background: rgba(99,102,241,0.09) !important;
      color: var(--blue-bright, #818cf8) !important;
      border-radius: 0;
    }
    .tab-inactive:hover {
      background: var(--row-alt);
    }

    /* ── Main content area (no padding — handled by .content-area) ── */
    .main-content {
      max-width: 1680px;
    }

    /* ── Info strip ── */
    .info-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 10px;
      border-left: 3px solid var(--blue);
      background: var(--card);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    /* ════════════════════════════════════════════
       APP SHELL & SIDEBAR LAYOUT
    ════════════════════════════════════════════ */

    /* ── Shell ── */
    .app-shell { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 216px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 50;
      overflow-y: auto;
      transition: transform 0.26s cubic-bezier(0.4,0,0.2,1), background 0.3s ease;
    }
    .sidebar.sidebar-closed { transform: translateX(-216px); }

    /* ── Sidebar brand ── */
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-brand-icon {
      width: 34px; height: 34px;
      border-radius: 11px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--grad-signature);
      box-shadow: 0 0 14px rgba(79,110,247,0.4);
    }
    .sidebar-brand-name {
      font-size: 13.5px;
      font-weight: 800;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.1;
    }
    .sidebar-brand-sub {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Sidebar nav ── */
    .sidebar-nav {
      flex: 1;
      padding: 8px 0;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .nav-group-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 16px 16px 5px;
      opacity: 0.7;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      width: calc(100% - 16px);
      margin: 0 8px 2px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      background: none;
      border: none;
      border-radius: var(--r-md);
      text-align: left;
      transition: background 0.14s, color 0.14s, transform 0.14s;
      white-space: nowrap;
      overflow: hidden;
    }
    .nav-item:hover {
      background: rgba(79,110,247,0.08);
      color: var(--text);
    }
    [data-theme="light"] .nav-item:hover { background: rgba(79,110,247,0.06); }
    .nav-item.nav-active {
      background: var(--blue);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(79,110,247,0.35);
    }
    [data-theme="light"] .nav-item.nav-active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 4px 14px rgba(79,110,247,0.25);
    }
    .nav-item.nav-active .nav-item-num { color: rgba(255,255,255,0.75); opacity: 1; }
    .nav-item-num {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      min-width: 14px;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .nav-badge {
      margin-left: auto;
      font-size: 9.5px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 1px 5px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    /* ── Sidebar bottom ── */
    .sidebar-bottom {
      flex-shrink: 0;
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .gen-emails-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 14px;
      border-radius: var(--r-md);
      border: none;
      background: var(--blue);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 4px 14px rgba(79,110,247,0.35);
      margin-bottom: 4px;
    }
    .gen-emails-btn:hover {
      background: var(--blue-bright);
      box-shadow: 0 6px 20px rgba(79,110,247,0.45);
      transform: translateY(-1px);
    }
    .nav-item-util {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      width: 100%;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      border-radius: 6px;
      text-align: left;
      transition: background 0.14s, color 0.14s;
    }
    .nav-item-util:hover { background: rgba(255,255,255,0.04); color: var(--text2); }
    [data-theme="light"] .nav-item-util:hover { background: rgba(0,0,0,0.04); }

    /* ── Main area ── */
    .main-area {
      flex: 1;
      margin-left: 216px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: margin-left 0.26s cubic-bezier(0.4,0,0.2,1);
    }
    .main-area.full-width { margin-left: 0; }

    /* ── Sidebar overlay (mobile) ── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 45;
    }
    .sidebar-overlay.visible { display: block; }

    /* ── Topbar ── */
    .topbar {
      background: var(--hdr-bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 40;
      flex-shrink: 0;
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px var(--content-px);
    }
    .topbar-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .topbar-icon-btn {
      width: 32px; height: 32px;
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      background: var(--hdr-icon-bg);
      border: 1px solid var(--border);
      color: var(--hdr-icon-clr);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .topbar-icon-btn:hover { opacity: 0.75; transform: translateY(-1px); }
    .topbar-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--grad-signature);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      cursor: pointer;
    }
    .hamburger-btn {
      display: none;
      width: 32px; height: 32px;
      border-radius: var(--r-sm);
      align-items: center; justify-content: center;
      background: var(--hdr-icon-bg);
      border: 1px solid var(--border);
      color: var(--hdr-icon-clr);
      cursor: pointer;
    }

    /* ── Content area ── */
    .content-area {
      flex: 1;
      padding: var(--content-py) var(--content-px);
    }

    /* ── Page header (consistent across all tabs) ── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .page-title {
      font-size: 22px;
      font-weight: 800;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0;
    }
    .page-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      font-weight: 400;
    }
    .page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-primary {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: var(--r-sm);
      background: var(--blue);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: var(--blue-bright); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(79,110,247,0.35); }
    .btn-secondary {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-radius: var(--r-sm);
      background: var(--card2);
      color: var(--text2);
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border2);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .btn-secondary:hover { background: var(--card); color: var(--text); border-color: var(--blue); }

    /* ── KPI row (consistent across all tabs) ── */
    .kpi-row {
      display: grid;
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-row.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .kpi-row.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .kpi-row.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .kpi-row.cols-5 { grid-template-columns: repeat(5, 1fr); }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--card-p);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); border-color: var(--border2); }
    [data-theme="light"] .kpi-card { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    [data-theme="light"] .kpi-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    .kpi-card-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .kpi-card-value {
      font-size: 28px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .kpi-card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }
    .kpi-card-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    /* Hero variant — coloured background */
    .kpi-card.kpi-hero {
      background: var(--blue);
      border-color: rgba(255,255,255,0.1);
    }
    .kpi-card.kpi-hero .kpi-card-label,
    .kpi-card.kpi-hero .kpi-card-value,
    .kpi-card.kpi-hero .kpi-card-sub { color: rgba(255,255,255,0.85); }
    .kpi-card.kpi-hero .kpi-card-value { color: #fff; }

    /* ── Section heading row (inside content) ── */
    .section-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .section-row .section-label { flex-shrink: 0; }
    .section-row-line { flex: 1; height: 1px; background: var(--border); }

    /* ── Tables (consistent) ── */
    .th-cell {
      background: var(--th-bg);
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: var(--cell-py) var(--cell-px);
      white-space: nowrap;
    }
    .row-alt:nth-child(even) { background: var(--row-alt); }
    .row-alt td {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s ease;
      padding: var(--cell-py) var(--cell-px);
      font-size: 12.5px;
    }
    .row-alt:hover td { background: var(--row-hover) !important; }
    .tbl-wrap { overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 380px); }

    /* ── Hero KPI card (dashboard first card) ── */
    .stat-card-hero {
      background: var(--blue) !important;
      border-color: rgba(255,255,255,0.12) !important;
      box-shadow: 0 6px 24px rgba(79,110,247,0.35) !important;
    }
    .stat-card-hero:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(79,110,247,0.45) !important;
    }

    /* ════════════════════════════════════════════
       RESPONSIVE
    ════════════════════════════════════════════ */
    @media (max-width: 1024px) {
      .sidebar { transform: translateX(-216px); }
      .sidebar.sidebar-open { transform: translateX(0); }
      .main-area { margin-left: 0; }
      .hamburger-btn { display: flex; }
      :root { --content-px: 20px; --content-py: 24px; }
    }
    @media (max-width: 768px) {
      :root { --content-px: 16px; --content-py: 20px; }
      .kpi-row.cols-3,
      .kpi-row.cols-4,
      .kpi-row.cols-5 { grid-template-columns: repeat(2, 1fr); }
      .topbar-inner { padding: 8px var(--content-px); }
      .page-title { font-size: 18px; }
    }
    @media (max-width: 480px) {
      .kpi-row.cols-3,
      .kpi-row.cols-4,
      .kpi-row.cols-5 { grid-template-columns: 1fr 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
    }
    @media (min-width: 1025px) {
      :root { --content-px: 40px; --content-py: 32px; }
    }

    /* ── Main content max-width ── */
    .main-content {
      max-width: 1680px;
      width: 100%;
    }

    /* ════════════════════════════════════════════
       SPACING NORMALIZATION
       — ensures consistent rhythm across all pages
    ════════════════════════════════════════════ */

    /* Section gaps */
    .section-gap   { margin-bottom: 24px; }
    .section-gap-sm { margin-bottom: 16px; }

    /* Card consistent padding */
    .card { padding: 0; }  /* padding set per-context via inline or utility */

    /* Consistent section-label style */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Tables: uniform row and header sizing across all tabs */
    .th-cell {
      padding: 10px var(--cell-px) !important;
      font-size: 10px !important;
      white-space: nowrap;
    }
    .row-alt td {
      padding: 11px var(--cell-px) !important;
      font-size: 12.5px !important;
    }

    /* Normalize first h2/h3 margin inside tab components */
    .content-area h1, .content-area h2 {
      margin-top: 0;
    }

    /* All <input>, <select>, <textarea> consistent focus ring */
    .content-area input:focus,
    .content-area select:focus,
    .content-area textarea:focus {
      border-color: var(--blue) !important;
      box-shadow: 0 0 0 3px rgba(79,110,247,0.12) !important;
    }

    /* Badge/pill base */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }

    /* Page-level fade on tab switch */
    .content-area > .main-content > * {
      animation: fadeIn 0.22s ease forwards;
    }

    /* ════════════════════════════════════════════
       AI ASSISTANT — persistent floating widget
       Signature element: gradient orb + slide-up panel.
       Lives at the App root, so it survives every tab change.
    ════════════════════════════════════════════ */
    @keyframes aiPulseRing {
      0%   { box-shadow: 0 0 0 0 rgba(79,110,247,0.45), 0 8px 24px rgba(79,110,247,0.4); }
      70%  { box-shadow: 0 0 0 14px rgba(79,110,247,0), 0 8px 24px rgba(79,110,247,0.4); }
      100% { box-shadow: 0 0 0 0 rgba(79,110,247,0), 0 8px 24px rgba(79,110,247,0.4); }
    }
    @keyframes aiPanelIn {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes aiBubbleIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes aiTypingDot {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }
    .ai-fab-wrap {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }
    .ai-panel-wrap {
      position: fixed;
      right: 24px;
      bottom: 92px;
      z-index: 60;
    }
    .ai-fab {
      width: 58px; height: 58px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: var(--grad-signature);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      position: relative;
      animation: aiPulseRing 3.2s cubic-bezier(0.4,0,0.6,1) infinite;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
      flex-shrink: 0;
    }
    .ai-fab:hover { transform: scale(1.06) rotate(-4deg); }
    .ai-fab:active { transform: scale(0.96); }
    .ai-fab-dot {
      position: absolute;
      top: -3px; right: -3px;
      width: 15px; height: 15px;
      border-radius: 50%;
      background: var(--red);
      border: 2px solid var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 800; color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }
    .ai-suggestion-bubble {
      max-width: 290px;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: var(--r-lg) var(--r-lg) 6px var(--r-lg);
      box-shadow: var(--shadow-pop);
      padding: 14px 16px;
      animation: aiBubbleIn 0.32s cubic-bezier(0.2,0.8,0.2,1) forwards;
      position: relative;
    }
    .ai-suggestion-bubble::after {
      content: '';
      position: absolute;
      bottom: -7px; right: 20px;
      width: 14px; height: 14px;
      background: var(--card);
      border-right: 1px solid var(--border2);
      border-bottom: 1px solid var(--border2);
      transform: rotate(45deg);
      border-radius: 0 0 3px 0;
    }
    .ai-suggestion-close {
      position: absolute;
      top: 8px; right: 8px;
      width: 18px; height: 18px;
      border-radius: 50%;
      border: none;
      background: var(--card2);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      line-height: 1;
    }
    .ai-suggestion-close:hover { background: var(--border2); color: var(--text); }
    .ai-panel {
      width: 392px;
      max-width: calc(100vw - 32px);
      height: 600px;
      max-height: calc(100vh - 110px);
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: aiPanelIn 0.26s cubic-bezier(0.2,0.8,0.2,1) forwards;
    }
    .ai-panel-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--grad-signature);
      color: #fff;
    }
    .ai-panel-avatar {
      width: 36px; height: 36px;
      border-radius: var(--r-sm);
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ai-panel-title { font-size: 13.5px; font-weight: 700; font-family: 'Plus Jakarta Sans','Inter',sans-serif; line-height: 1.2; }
    .ai-panel-status { font-size: 10.5px; opacity: 0.85; display: flex; align-items: center; gap: 5px; margin-top: 1px; }
    .ai-panel-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; flex-shrink: 0; }
    .ai-panel-iconbtn {
      width: 28px; height: 28px;
      border-radius: var(--r-sm);
      border: none;
      background: rgba(255,255,255,0.14);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .ai-panel-iconbtn:hover { background: rgba(255,255,255,0.26); }
    .ai-panel-body {
      flex: 1;
      overflow-y: auto;

function findAIExactMatches(state, queryText) {
    if (!queryText)
        return '';
    const tokens = Array.from(new Set((queryText.match(/[A-Za-z0-9][A-Za-z0-9\-\/]{3,}/g) || [])))
        .filter(t => (t.match(/\d/g) || []).length >= 3)
        .slice(0, 8);
    if (!tokens.length)
        return '';
    const mrp = state.mrp || [], sc = state.sc || [], mc16 = state.mc16 || [], pms = state.pms || [];
    const lines = [];
    const seen = new Set();
    function add(line) {
        if (!seen.has(line)) {
            seen.add(line);
            lines.push(line);
        }
    }
    tokens.forEach(tok => {
        const low = tok.toLowerCase();
        const hit = v => v !== undefined && v !== null && String(v).toLowerCase().includes(low);
        mrp.forEach(r => {
            if (hit(r.orderNumber) || hit(r.itemNumber))
                add(aiLine(['[MRP]', `PO ${r.orderNumber}`, `Item ${r.itemNumber}${r.itemDescription ? ' (' + r.itemDescription + ')' : ''}`, r.supplierName || 'Unknown supplier', `planned ${r.plannedReceiptDate || '?'}`, `qty ${r.quantityDelivered ?? 0}/${r.quantityOrdered ?? '?'}`, r.confirmationStatus || '', r.rowStatus || '']));
        });
        sc.forEach(r => {
            if (hit(r.scheduleNumber) || hit(r.itemNumber))
                add(aiLine(['[SC]', `Schedule ${r.scheduleNumber}`, `Item ${r.itemNumber}${r.itemDescription ? ' (' + r.itemDescription + ')' : ''}`, r.supplierName || 'Unknown supplier', `planned ${r.plannedReceiptDate || '?'}`]));
        });
        mc16.forEach(r => {
            if (hit(r.articleNumber))
                add(aiLine(['[MC16]', `Item ${r.articleNumber}${r.articleName ? ' (' + r.articleName + ')' : ''}`, `stockout ${r.outOfStockDate || '?'}`, `status ${r.status || ''}`]));
        });
        pms.forEach(r => {
            if (hit(r.poNumber) || hit(r.itemNumber))
                add(aiLine(['[PSM]', r.signal, `PO ${r.poNumber}${r.poLine ? ' line ' + r.poLine : ''}`, `Item ${r.itemNumber}`, r.supplier || 'Unknown supplier', `${r.oldDate || '?'} \u2192 ${r.newDate || '?'}`]));
        });
    });

}
